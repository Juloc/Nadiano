services:
  nadiano:
    build:
      context: .
      dockerfile: Dockerfile
    image: nadiano:local
    ports:
      - "8098:8080"
    volumes:
      - nadiano_data:/data
    environment:
      ASPNETCORE_URLS: http://+:8080
      Nadiano__DataPath: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  nadiano_data:

<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <rect x="0" y="0" width="400" height="160" fill="#ffffff"/>
  <!-- keyboard with one highlighted black key -->
  <rect x="60" y="60" width="280" height="60" fill="#ffffff" stroke="#1b1f24" stroke-width="2"/>
  <line x1="130" y1="60" x2="130" y2="120" stroke="#1b1f24" stroke-width="1"/>
  <line x1="200" y1="60" x2="200" y2="120" stroke="#1b1f24" stroke-width="1"/>
  <line x1="270" y1="60" x2="270" y2="120" stroke="#1b1f24" stroke-width="1"/>
  <rect x="180" y="60" width="18" height="38" fill="#1c5fb8"/>
  <!-- press then release, circular motion arrow above the key -->
  <path d="M175 40 a20 12 0 1 1 24 0" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#tip)"/>
  <defs>
    <marker id="tip" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4b5563"/>
    </marker>
  </defs>
  <text x="200" y="145" font-family="sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">spielen — und wieder lösen</text>
</svg>

<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <rect x="0" y="0" width="400" height="160" fill="#ffffff"/>
  <!-- left: natural rounded hand shape -->
  <g>
    <path d="M60 120 Q70 70 100 65 Q130 60 140 90 Q145 110 130 120 Z" fill="none" stroke="#2f9e44" stroke-width="3"/>
    <circle cx="65" cy="118" r="4" fill="#2f9e44"/>
    <circle cx="135" cy="118" r="4" fill="#2f9e44"/>
    <text x="100" y="145" font-family="sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">natürlich gerundet</text>
  </g>
  <!-- right: forced flat "ball" shape -->
  <g>
    <ellipse cx="300" cy="95" rx="42" ry="26" fill="none" stroke="#c92a2a" stroke-width="3"/>
    <text x="300" y="145" font-family="sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">erzwungene Kugel</text>
  </g>
  <line x1="200" y1="20" x2="200" y2="140" stroke="#d0d5dd" stroke-width="1" stroke-dasharray="4 3"/>
</svg>

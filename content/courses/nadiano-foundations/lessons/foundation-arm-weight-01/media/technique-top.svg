<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <rect x="0" y="0" width="400" height="160" fill="#ffffff"/>
  <!-- keyboard segment -->
  <rect x="80" y="100" width="240" height="40" fill="#ffffff" stroke="#1b1f24" stroke-width="2"/>
  <rect x="185" y="100" width="18" height="40" fill="#1c5fb8"/>
  <!-- arm schematic from above, weight going down -->
  <line x1="200" y1="20" x2="200" y2="90" stroke="#1b1f24" stroke-width="3"/>
  <circle cx="200" cy="18" r="6" fill="#1b1f24"/>
  <path d="M200 90 L192 100 M200 90 L208 100" stroke="#1b1f24" stroke-width="3" fill="none"/>
  <path d="M170 55 Q200 40 230 55" fill="none" stroke="#1c5fb8" stroke-width="2" marker-end="url(#arrowDown)"/>
  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#1c5fb8"/>

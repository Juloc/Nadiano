  <rect x="150" y="95" width="220" height="16" rx="2" fill="#ffffff" stroke="#1b1f24" stroke-width="2"/>
  <rect x="150" y="95" width="220" height="16" fill="none" stroke="#d0d5dd" stroke-width="1"/>
  <!-- stool -->
  <rect x="70" y="118" width="46" height="10" rx="2" fill="#f5f7fa" stroke="#1b1f24" stroke-width="2"/>
  <line x1="78" y1="128" x2="78" y2="150" stroke="#1b1f24" stroke-width="2"/>
  <line x1="108" y1="128" x2="108" y2="150" stroke="#1b1f24" stroke-width="2"/>

  <line x1="165" y1="90" x2="150" y2="35" stroke="#1c5fb8" stroke-width="4" stroke-linecap="round"/>
  <line x1="185" y1="90" x2="180" y2="25" stroke="#1c5fb8" stroke-width="4" stroke-linecap="round"/>
  <line x1="205" y1="90" x2="205" y2="20" stroke="#1c5fb8" stroke-width="4" stroke-linecap="round"/>
  <line x1="225" y1="90" x2="228" y2="25" stroke="#1c5fb8" stroke-width="4" stroke-linecap="round"/>
  <line x1="245" y1="90" x2="255" y2="35" stroke="#1c5fb8" stroke-width="4" stroke-linecap="round"/>
  <text x="150" y="28" font-family="sans-serif" font-size="14" fill="#1b1f24" text-anchor="middle">1</text>
  <text x="180" y="18" font-family="sans-serif" font-size="14" fill="#1b1f24" text-anchor="middle">2</text>
  <text x="205" y="13" font-family="sans-serif" font-size="14" fill="#1b1f24" text-anchor="middle">3</text>
  <text x="228" y="18" font-family="sans-serif" font-size="14" fill="#1b1f24" text-anchor="middle">4</text>
  <text x="255" y="28" font-family="sans-serif" font-size="14" fill="#1b1f24" text-anchor="middle">5</text>
</svg>

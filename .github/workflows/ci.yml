name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet format Nadiano.slnx --verify-no-changes

  frontend:
    name: Frontend build, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Nadiano.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/Nadiano.Web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test
      - run: npm audit --audit-level=high

  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: dotnet restore Nadiano.slnx --locked-mode
      - run: dotnet build Nadiano.slnx -c Release --no-restore
      - run: dotnet test Nadiano.slnx -c Release --no-build
      - run: dotnet list Nadiano.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.log
      - name: Fail on known vulnerable packages
        run: |
          if grep -q "has the following vulnerable packages" vulnerable.log; then
            echo "Vulnerable NuGet packages found:"
            cat vulnerable.log
            exit 1
          fi

  browser:
    name: Alpha browser path
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build frontend
        working-directory: src/Nadiano.Web
        run: |
          npm ci
          npm run build
      - run: dotnet restore tests/Nadiano.BrowserTests/Nadiano.BrowserTests.csproj
      - run: dotnet build tests/Nadiano.BrowserTests/Nadiano.BrowserTests.csproj -c Release --no-restore -p:SkipFrontendBuild=true
      - name: Install Chromium
        run: pwsh tests/Nadiano.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run critical browser path
        run: dotnet test tests/Nadiano.BrowserTests/Nadiano.BrowserTests.csproj -c Release --no-build
        env:
          NADIANO_RUN_BROWSER_TESTS: "1"

  content:
    name: Bundled content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet run --project tools/Nadiano.ContentValidator -c Release -- content

  docker:
    name: Docker image build and scan
    runs-on: ubuntu-latest
    needs: [dotnet, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nadiano:ci

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nadiano:ci
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

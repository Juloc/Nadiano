name: Stable release

on:
  push:
    branches: [main]
    paths:
      - release/stable.json
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  REGISTRY_IMAGE: ghcr.io/juloc/nadiano

jobs:
  release:
    name: Verify, publish and release stable 1.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Nadiano.Web/package-lock.json

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          version="$(jq -r '.version' release/stable.json)"
          notes="$(jq -r '.releaseNotes' release/stable.json)"
          [[ "$version" =~ ^1\.0\.[0-9]+$ ]]
          test -f "$notes"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Frontend verification
        working-directory: src/Nadiano.Web
        run: |
          npm ci
          npm run build
          npm run lint
          npm run test
          npm audit --audit-level=high

      - name: Enforce frontend performance budget
        working-directory: src/Nadiano.Web
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const limits = {
            'wwwroot/dist/pages/practice.js': 2300000,
            'wwwroot/dist/pages/beta-practice.js': 300000,
            'wwwroot/dist/pages/setup.js': 100000,
          };
          for (const [file, limit] of Object.entries(limits)) {
            const size = fs.statSync(file).size;
            console.log(`${file}: ${size} bytes / ${limit} bytes`);
            if (size > limit) process.exitCode = 1;
          }
          NODE

      - name: .NET and content verification
        run: |
          dotnet restore Nadiano.slnx
          dotnet format Nadiano.slnx --verify-no-changes --no-restore
          dotnet build Nadiano.slnx -c Release --no-restore
          dotnet test Nadiano.slnx -c Release --no-build
          dotnet run --project tools/Nadiano.ContentValidator -c Release --no-build -- content

      - name: Install Chromium
        run: pwsh tests/Nadiano.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Verify browser and accessibility paths
        run: dotnet test tests/Nadiano.BrowserTests/Nadiano.BrowserTests.csproj -c Release --no-build
        env:
          NADIANO_RUN_BROWSER_TESTS: "1"

      - name: Create release bundle and dependency reports
        shell: bash
        run: |
          output="artifacts/Nadiano-${{ steps.release.outputs.version }}-linux-x64"
          mkdir -p "$output"
          dotnet publish src/Nadiano.Web/Nadiano.Web.csproj -c Release -o "$output" --no-build -p:SkipFrontendBuild=true
          cp -R content "$output/content"
          cp README.md "$output/README.md"
          cp docs/FIRST_RUN_AND_BROWSER_SUPPORT.md "$output/FIRST_RUN_AND_BROWSER_SUPPORT.md"
          cp docs/BACKUP_AND_RESTORE.md "$output/BACKUP_AND_RESTORE.md"
          cp docs/UPGRADE_TO_1.0.md "$output/UPGRADE_TO_1.0.md"
          cp docs/PRIVACY.md "$output/PRIVACY.md"
          dotnet list Nadiano.slnx package --include-transitive > artifacts/dotnet-packages.txt
          (cd src/Nadiano.Web && npm ls --all --json) > artifacts/npm-packages.json
          python3 tools/generate-license-report.py artifacts/third-party-licenses.tsv
          tar -czf "artifacts/Nadiano-${{ steps.release.outputs.version }}-linux-x64.tar.gz" -C "$output" .
          sha256sum "artifacts/Nadiano-${{ steps.release.outputs.version }}-linux-x64.tar.gz" > "artifacts/Nadiano-${{ steps.release.outputs.version }}-linux-x64.tar.gz.sha256"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.version=${{ steps.release.outputs.version }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${REGISTRY_IMAGE}:${{ steps.release.outputs.version }}" \
            -t "${REGISTRY_IMAGE}:${{ steps.release.outputs.sha_tag }}" \
            -t "${REGISTRY_IMAGE}:latest" \
            .
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:${{ steps.release.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Profile container on modest hardware limits
        shell: bash
        run: |
          set -euo pipefail
          candidate="${REGISTRY_IMAGE}:${{ steps.release.outputs.version }}"
          volume="nadiano-performance-${GITHUB_RUN_ID}"
          container="nadiano-performance-${GITHUB_RUN_ID}"
          timings="${RUNNER_TEMP}/nadiano-performance-times.tsv"
          docker volume create "$volume" >/dev/null
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          started_ms="$(date +%s%3N)"
          docker run -d --name "$container" \
            --cpus=1 --memory=512m --memory-swap=512m \
            -p 18088:8080 -v "$volume:/data" "$candidate" >/dev/null
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:18088/health/ready >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://localhost:18088/health/ready >/dev/null
          ready_ms="$(date +%s%3N)"
          startup_ms="$((ready_ms - started_ms))"
          test "$startup_ms" -le 30000

          : > "$timings"
          for path in / /Setup /Learn /Practice/Beta /health/ready; do
            curl -fsS "http://localhost:18088${path}" >/dev/null
            for sample in $(seq 1 10); do
              seconds="$(curl -fsS -o /dev/null -w '%{time_total}' "http://localhost:18088${path}")"
              printf '%s\t%s\n' "$path" "$seconds" >> "$timings"
            done
          done

          STARTUP_MS="$startup_ms" TIMINGS="$timings" python3 <<'PY'
          import json
          import math
          import os
          from collections import defaultdict
          from pathlib import Path

          samples = defaultdict(list)
          for line in Path(os.environ["TIMINGS"]).read_text().splitlines():
              path, seconds = line.split("\t")
              samples[path].append(float(seconds) * 1000.0)

          thresholds = {
              "/": 1500.0,
              "/Setup": 1500.0,
              "/Learn": 1500.0,
              "/Practice/Beta": 1500.0,
              "/health/ready": 500.0,
          }
          results = {}
          failed = False
          for path, values in samples.items():
              ordered = sorted(values)
              p95 = ordered[max(0, math.ceil(len(ordered) * 0.95) - 1)]
              results[path] = {
                  "samples": len(values),
                  "medianMs": round(ordered[len(ordered) // 2], 2),
                  "p95Ms": round(p95, 2),
                  "limitMs": thresholds[path],
              }
              if p95 > thresholds[path]:
                  failed = True

          output = {
              "limits": {"cpus": 1, "memoryMiB": 512},
              "startupMs": int(os.environ["STARTUP_MS"]),
              "startupLimitMs": 30000,
              "routes": results,
              "result": "failure" if failed else "success",
          }
          Path("artifacts/performance-profile.json").write_text(json.dumps(output, indent=2) + "\n")
          print(json.dumps(output, indent=2))
          if failed:
              raise SystemExit(1)
          PY

      - name: Rehearse upgrade, cold restore and rollback
        shell: bash
        run: |
          set -euo pipefail
          source_volume="nadiano-upgrade-${GITHUB_RUN_ID}"
          backup_volume="nadiano-backup-${GITHUB_RUN_ID}"
          restore_volume="nadiano-restore-${GITHUB_RUN_ID}"
          rollback_volume="nadiano-rollback-${GITHUB_RUN_ID}"
          cookies="${RUNNER_TEMP}/nadiano-cookies.txt"
          candidate="${REGISTRY_IMAGE}:${{ steps.release.outputs.version }}"
          source_beta="${REGISTRY_IMAGE}:0.2.0-beta.1"

          for volume in "$source_volume" "$backup_volume" "$restore_volume" "$rollback_volume"; do
            docker volume create "$volume" >/dev/null
          done

          cleanup() {
            docker rm -f nadiano-roadmap-rehearsal >/dev/null 2>&1 || true
            for volume in "$source_volume" "$backup_volume" "$restore_volume" "$rollback_volume"; do
              docker volume rm "$volume" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          wait_ready() {
            for attempt in $(seq 1 60); do
              if curl -fsS http://localhost:18087/health/ready >/dev/null; then
                return 0
              fi
              sleep 2
            done
            curl -fsS http://localhost:18087/health/ready >/dev/null
          }

          start_image() {
            local image="$1"
            local volume="$2"
            docker rm -f nadiano-roadmap-rehearsal >/dev/null 2>&1 || true
            docker run -d --name nadiano-roadmap-rehearsal -p 18087:8080 -v "$volume:/data" "$image" >/dev/null
            wait_ready
          }

          copy_volume() {
            local source="$1"
            local target="$2"
            docker run --rm --user 0 --entrypoint /bin/sh \
              -v "$source:/from:ro" -v "$target:/to" "$candidate" \
              -c 'cp -a /from/. /to/'
          }

          verify_profile() {
            local output="$1"
            curl -fsS -b "$cookies" "http://localhost:18087/api/profiles/${profile_id}/export" -o "$output"
            jq -e --arg id "$profile_id" '.id == $id and (.sessions | type == "array")' "$output" >/dev/null
          }

          docker pull "$source_beta"
          start_image "$source_beta" "$source_volume"
          curl -fsS -c "$cookies" http://localhost:18087/Profiles -o "${RUNNER_TEMP}/beta-profiles.html"
          profile_id="$(awk '$6 == "nadiano-profile-id" {print $7}' "$cookies" | tail -1)"
          test -n "$profile_id"
          verify_profile "${RUNNER_TEMP}/beta-profile.json"
          docker rm -f nadiano-roadmap-rehearsal >/dev/null

          copy_volume "$source_volume" "$backup_volume"

          start_image "$candidate" "$source_volume"
          curl -fsS http://localhost:18087/api/diagnostics/version -o "${RUNNER_TEMP}/stable-version.json"
          jq -e --arg version "${{ steps.release.outputs.version }}" '.applicationVersion == $version' "${RUNNER_TEMP}/stable-version.json" >/dev/null
          verify_profile "${RUNNER_TEMP}/upgraded-profile.json"
          jq -n --arg source "0.2.0-beta.1" --arg target "${{ steps.release.outputs.version }}" --arg profileId "$profile_id" \
            '{sourceVersion: $source, targetVersion: $target, preservedProfileId: $profileId, result: "success"}' \
            > artifacts/upgrade-rehearsal.json
          docker rm -f nadiano-roadmap-rehearsal >/dev/null

          copy_volume "$backup_volume" "$restore_volume"
          start_image "$candidate" "$restore_volume"
          verify_profile "${RUNNER_TEMP}/restored-profile.json"
          jq -n --arg target "${{ steps.release.outputs.version }}" --arg profileId "$profile_id" \
            '{targetVersion: $target, restoredIntoCleanVolume: true, preservedProfileId: $profileId, result: "success"}' \
            > artifacts/restore-rehearsal.json
          docker rm -f nadiano-roadmap-rehearsal >/dev/null

          copy_volume "$backup_volume" "$rollback_volume"
          start_image "$source_beta" "$rollback_volume"
          verify_profile "${RUNNER_TEMP}/rollback-profile.json"
          jq -n --arg version "0.2.0-beta.1" --arg profileId "$profile_id" \
            '{rollbackVersion: $version, restoredPreUpgradeBackup: true, preservedProfileId: $profileId, result: "success"}' \
            > artifacts/rollback-rehearsal.json

      - name: Push stable image tags
        run: |
          docker push "${REGISTRY_IMAGE}:${{ steps.release.outputs.version }}"
          docker push "${REGISTRY_IMAGE}:${{ steps.release.outputs.sha_tag }}"
          docker push "${REGISTRY_IMAGE}:latest"

      - name: Create stable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          git fetch --tags --force
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --latest --title "Nadiano ${{ steps.release.outputs.version }}" --notes-file "${{ steps.release.outputs.notes }}"
          else
            gh release create "$tag" --latest --verify-tag --title "Nadiano ${{ steps.release.outputs.version }}" --notes-file "${{ steps.release.outputs.notes }}"
          fi
          gh release upload "$tag" \
            "artifacts/Nadiano-${{ steps.release.outputs.version }}-linux-x64.tar.gz" \
            "artifacts/Nadiano-${{ steps.release.outputs.version }}-linux-x64.tar.gz.sha256" \
            artifacts/dotnet-packages.txt \
            artifacts/npm-packages.json \
            artifacts/third-party-licenses.tsv \
            artifacts/performance-profile.json \
            artifacts/upgrade-rehearsal.json \
            artifacts/restore-rehearsal.json \
            artifacts/rollback-rehearsal.json \
            --clobber

name: Add missing Alpha files

on:
  push:
    branches:
      - work/nadiano-alpha-20260805
    paths:
      - .github/agent-new-files.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and commit missing files
        shell: bash
        run: |
          echo "f691e3b419e1cdb3863ebd58bf1236f6e834e71313819ad55ed45f38cb6d0126  .github/agent-new-files.chunk-00" | sha256sum -c -
          echo "7483b22537beccd92d41734e5e133f2f6cde37942f0f0e07a51522db3aa53eda  .github/agent-new-files.chunk-01" | sha256sum -c -
          echo "4224abff8d385161f0249aaa84ca78bafa2fc1faede000233ba0e838428c9bcc  .github/agent-new-files.chunk-02" | sha256sum -c -
          echo "736ad3bc861e2bb540d580487134b1f9a9cf0b908ca6b2f95ebe1407daf523fc  .github/agent-new-files.chunk-03" | sha256sum -c -
          echo "73351eac3724d23b250ec423903f7848869aa6a3f53d47f414cc3eab4e6e6125  .github/agent-new-files.chunk-04" | sha256sum -c -
          echo "04f9c0678bbb3902006b8481bbdb1070b81d24a9208e11ed5f0560598f0280a2  .github/agent-new-files.chunk-05" | sha256sum -c -
          cat .github/agent-new-files.chunk-* | base64 --decode > /tmp/nadiano-new-files.tar.gz
          echo "e81354875b8cb15c79b5d6de24cb913faa3bbd1fcd6ef9fbbdc8b65c85a1a353  /tmp/nadiano-new-files.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nadiano-new-files.tar.gz
          rm -f .github/agent-new-files.chunk-* .github/agent-new-files.part-* .github/agent-new-files.ready
          git config user.name "Juloc"
          git config user.email "juli.hiresch@gmail.com"
          git add -A
          git commit -m "Add complete Alpha content, services and verification files"
          git push origin HEAD:work/nadiano-alpha-20260805

name: Fix Alpha verification tests

on:
  push:
    branches:
      - work/nadiano-alpha-20260805
    paths:
      - .github/agent-fix-tests.ready

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply deterministic test corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          practice = Path('tests/Nadiano.Web.IntegrationTests/Features/Practice/PracticePageTests.cs')
          text = practice.read_text()
          old = '        var html = await response.Content.ReadAsStringAsync();'
          new = '        var html = WebUtility.HtmlDecode(await response.Content.ReadAsStringAsync());'
          if old not in text:
              raise SystemExit('Practice assertion source was not found')
          practice.write_text(text.replace(old, new, 1))

          progress = Path('tests/Nadiano.Web.IntegrationTests/Features/Progress/ProgressPageTests.cs')
          text = progress.read_text()
          replacements = {
              '        var germanHtml = await germanResponse.Content.ReadAsStringAsync();':
                  '        var germanHtml = WebUtility.HtmlDecode(await germanResponse.Content.ReadAsStringAsync());',
              '        var indonesianHtml = await indonesianResponse.Content.ReadAsStringAsync();':
                  '        var indonesianHtml = WebUtility.HtmlDecode(await indonesianResponse.Content.ReadAsStringAsync());',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Progress assertion source was not found: {old}')
              text = text.replace(old, new, 1)
          progress.write_text(text)

          browser = Path('tests/Nadiano.BrowserTests/AlphaCriticalPathBrowserTests.cs')
          text = browser.read_text()
          old = '            await page.Locator("a[href*=\'/Practice\']").ClickAsync();'
          new = '            await page.Locator("#main-content a[href=\'/Practice?lessonId=exercise-single-tone-01\']").ClickAsync();'
          if old not in text:
              raise SystemExit('Browser locator source was not found')
          browser.write_text(text.replace(old, new, 1))
          PY
          dotnet format Nadiano.slnx
          rm -f .github/agent-fix-tests.ready
          git config user.name "Juloc"
          git config user.email "juli.hiresch@gmail.com"
          git add tests .github/agent-fix-tests.ready
          git commit -m "Fix localized assertions and browser practice locator"
          git push origin HEAD:work/nadiano-alpha-20260805

name: Apply dotnet format

on:
  push:
    branches:
      - work/nadiano-alpha-20260805
    paths:
      - .github/agent-format.ready

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply formatter
        shell: bash
        run: |
          dotnet format Nadiano.slnx
          rm -f .github/agent-format.ready
          git config user.name "Juloc"
          git config user.email "juli.hiresch@gmail.com"
          git add -A
          git commit -m "Apply repository formatting"
          git push origin HEAD:work/nadiano-alpha-20260805

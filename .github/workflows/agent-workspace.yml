name: Agent workspace archive

on:
  push:
    branches:
      - work/nadiano-alpha-20260805

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate expected events
        run: dotnet run --project tools/Nadiano.ContentValidator -c Release -- --generate content
      - name: Validate generated content
        run: dotnet run --project tools/Nadiano.ContentValidator -c Release -- content
      - uses: actions/upload-artifact@v4
        with:
          name: nadiano-generated-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1

name: Agent workspace archive

on:
  push:
    branches:
      - work/nadiano-alpha-20260805

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: nadiano-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1

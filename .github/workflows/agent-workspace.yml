name: Apply alpha workspace

on:
  push:
    branches:
      - work/nadiano-alpha-20260805
    paths:
      - .github/agent-diff.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared source diff
        shell: bash
        run: |
          cat .github/agent-diff.part-* | base64 --decode > /tmp/nadiano.patch.xz
          echo "b2423e413776f8bfeb21bf2c26ce3b428384bedfadeb365e5d3a4cdd1620eac7  /tmp/nadiano.patch.xz" | sha256sum -c -
          xz -dc /tmp/nadiano.patch.xz > /tmp/nadiano.patch
          git apply --binary --whitespace=nowarn /tmp/nadiano.patch
          rm -f .github/agent-patch.part-* .github/agent-diff.part-* .github/agent-diff.ready
          rm .github/workflows/agent-workspace.yml
          git config user.name "Juloc"
          git config user.email "juli.hiresch@gmail.com"
          git add -A
          git commit -m "Complete alpha learning path and release hardening"
          git push origin HEAD:work/nadiano-alpha-20260805
